<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0a0a0a">
  <title>Verificar recibo | Barbería Augusto</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0a0a'/%3E%3Cg fill='none' stroke='%23c9a24b' stroke-width='4' stroke-linecap='round'%3E%3Ccircle cx='18' cy='18' r='7'/%3E%3Ccircle cx='18' cy='46' r='7'/%3E%3Cpath d='M52 12 23 41M38 38l14 14M23 23l9 9'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --oro: #c9a24b;
      --oro-claro: #e9cd88;
      --oro-grad: linear-gradient(135deg, #f1d796 0%, #d2ac57 42%, #ad8536 100%);
      --fondo: #0a0a0a;
      --tarjeta-2: #1b1b1b;
      --borde: rgba(255, 255, 255, .08);
      --borde-2: rgba(255, 255, 255, .15);
      --texto: #f5f0e6;
      --suave: #aaa397;
      --tenue: #77716a;
      --verde: #8ef0b1;
      --rojo: #f4b0b0;
      --serif: 'Playfair Display', Georgia, 'Times New Roman', serif;
      --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { -webkit-text-size-adjust: 100%; color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; min-height: 100svh; font-family: var(--sans); font-size: 15.5px; line-height: 1.5;
      background: radial-gradient(120% 60% at 50% 0%, rgba(201, 162, 75, .1), transparent 60%), var(--fondo);
      color: var(--texto); -webkit-font-smoothing: antialiased; font-variant-numeric: lining-nums;
    }
    h1, h2 { margin: 0; font-family: var(--serif); font-weight: 600; line-height: 1.15; }
    :focus-visible { outline: 2px solid var(--oro-claro); outline-offset: 2px; }

    .pagina { max-width: 560px; margin: 0 auto; padding: 28px 16px calc(32px + env(safe-area-inset-bottom)); }
    .marca { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; color: inherit; text-decoration: none; }
    .marca svg { width: 40px; height: 40px; }
    .marca strong { display: block; font-family: var(--serif); font-size: 19px; font-weight: 600; }
    .eyebrow { display: inline-flex; align-items: center; gap: 10px; font: 600 11px/1.2 var(--sans); letter-spacing: .28em; text-transform: uppercase; color: var(--oro); }

    .tarjeta {
      background: linear-gradient(180deg, #161616, #111); border: 1px solid var(--borde); border-radius: 20px; padding: 22px 18px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .04), 0 24px 50px -30px rgba(0, 0, 0, .9);
    }
    @media (min-width: 600px) { .tarjeta { padding: 28px 30px; } }

    .estado { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
    .estado .sello { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0; }
    .estado .sello svg { width: 24px; height: 24px; }
    .estado h1 { font-size: 24px; }
    .estado p { margin: 2px 0 0; color: var(--suave); font-size: 13.5px; }
    .ok .sello { background: rgba(74, 222, 128, .12); color: var(--verde); }
    .anulado .sello, .error .sello { background: rgba(229, 138, 138, .12); color: var(--rojo); }
    .cargando .sello { background: rgba(255, 255, 255, .06); color: var(--suave); }
    .cargando .sello svg { animation: girar .9s linear infinite; }
    @keyframes girar { to { transform: rotate(360deg); } }

    .aviso { margin: 0 0 16px; padding: 12px 14px; border-radius: 14px; background: rgba(229, 138, 138, .1); border: 1px solid rgba(229, 138, 138, .35); color: var(--rojo); font-weight: 600; font-size: 14.5px; }

    .monto { margin: 0 0 18px; padding: 16px; border-radius: 16px; background: var(--tarjeta-2); border: 1px solid var(--borde); text-align: center; }
    .monto small { display: block; color: var(--suave); font-size: 12.5px; margin-bottom: 2px; }
    .monto strong { display: block; font-family: var(--serif); font-size: 32px; font-weight: 600; color: var(--oro-claro); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    .anulado .monto strong { color: var(--suave); text-decoration: line-through; }

    .datos { margin: 0; display: grid; gap: 0; }
    .datos div { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; padding: 11px 0; border-top: 1px solid var(--borde); }
    .datos dt { color: var(--suave); font-size: 12.5px; }
    .datos dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
    .datos .codigo { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .04em; }
    @media (min-width: 480px) {
      .datos div { grid-template-columns: 150px minmax(0, 1fr); gap: 12px; align-items: baseline; }
    }

    .acciones { margin-top: 20px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 9px; width: 100%; min-height: 50px; padding: 0 20px; border-radius: 999px; border: 0;
      background: var(--oro-grad); color: #17130a; font: 600 14.5px/1.2 var(--sans); cursor: pointer;
      box-shadow: 0 10px 26px -12px rgba(201, 162, 75, .6), inset 0 1px 0 rgba(255, 255, 255, .4); -webkit-tap-highlight-color: transparent;
    }
    .btn svg { width: 18px; height: 18px; }
    .btn:active { transform: scale(.98); }

    .pie { margin-top: 18px; text-align: center; color: var(--tenue); font-size: 12.5px; }
    .solo-impresion { display: none; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }

    @page { size: A4; margin: 18mm 16mm; }
    @media print {
      html { color-scheme: light; }
      body { background: #fff; color: #111; font-size: 11pt; }
      .pagina { max-width: none; padding: 0; }
      .marca { margin-bottom: 14mm; }
      .marca svg rect { fill: #fff; stroke: #111; stroke-width: 2; }
      .marca svg g { stroke: #111; }
      .eyebrow { color: #555; }
      .tarjeta { background: #fff; border: 1px solid #bbb; border-radius: 6px; box-shadow: none; padding: 10mm; }
      .estado .sello { border: 1px solid #999; background: #fff !important; color: #111 !important; }
      .estado p, .datos dt, .monto small, .pie { color: #555; }
      .monto { background: #f6f6f6; border-color: #ccc; }
      .monto strong { color: #111 !important; }
      .datos div { border-top-color: #ddd; break-inside: avoid; }
      .aviso { background: #fff; color: #900; border-color: #900; }
      .no-imprimir { display: none !important; }
      .solo-impresion { display: block; }
    }
  </style>
</head>
<body>
  <main class="pagina">
    <a class="marca" href="index.html">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#0a0a0a"/><g fill="none" stroke="#c9a24b" stroke-width="4" stroke-linecap="round"><circle cx="18" cy="18" r="7"/><circle cx="18" cy="46" r="7"/><path d="M52 12 23 41M38 38l14 14M23 23l9 9"/></g></svg>
      <span><span class="eyebrow">Verificación de recibo</span><strong>Barbería Augusto</strong></span>
    </a>

    <section class="tarjeta cargando" id="caja" aria-live="polite">
      <div class="estado">
        <span class="sello" id="sello"></span>
        <div>
          <h1 id="titulo">Verificando recibo…</h1>
          <p id="bajada">Un momento, estamos consultando el registro.</p>
        </div>
      </div>

      <div id="detalle" hidden>
        <p class="aviso" id="avisoAnulado" hidden>Este recibo fue anulado</p>
        <div class="monto"><small>Monto</small><strong id="vMonto"></strong></div>
        <dl class="datos">
          <div><dt>Código</dt><dd class="codigo" id="vCodigo"></dd></div>
          <div><dt>Fecha de emisión</dt><dd id="vFecha"></dd></div>
          <div><dt>Período</dt><dd id="vPeriodo"></dd></div>
          <div><dt>Concepto</dt><dd id="vConcepto"></dd></div>
          <div><dt>Emisor</dt><dd id="vEmisor"></dd></div>
        </dl>
        <div class="acciones no-imprimir">
          <button class="btn" type="button" id="imprimir">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 9V3h10v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/></svg>
            Imprimir / Guardar como PDF
          </button>
        </div>
        <p class="pie solo-impresion" id="pieImpresion"></p>
      </div>
    </section>

    <p class="pie no-imprimir">Esta página confirma si un recibo emitido por Fox &amp; Co. Digital es auténtico.</p>
  </main>

  <script>
    // ===== CONEXIÓN CON LA BASE DE DATOS (la misma URL y clave pública que usa el sitio) =====
    const SUPABASE_URL = "https://buvcgwjmmgzvhrnebleb.supabase.co";
    const SUPABASE_KEY = "sb_publishable_LVw0YJW6ujE4ST69gSrpwQ_C9do6GOT";
    const EMISOR = "Fox & Co. Digital";

    const $ = id => document.getElementById(id);

    // Mismo adaptador "sb.rpc" que usa el panel, pero sin sesión: entra como visitante (rol anon)
    const sb = {
      rpc: async function (nombre, params) {
        try {
          const r = await fetch(SUPABASE_URL + "/rest/v1/rpc/" + nombre, {
            method: "POST",
            headers: { "apikey": SUPABASE_KEY, "Content-Type": "application/json" },
            body: JSON.stringify(params || {})
          });
          const datos = await r.json().catch(function () { return null; });
          return r.ok ? { data: datos, error: null } : { data: null, error: datos || { status: r.status } };
        } catch (e) { return { data: null, error: e }; }
      }
    };

    const ICONOS = {
      ok: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
      alerta: '<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L2.4 17.5a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
      cargando: '<path d="M20 11a8 8 0 1 0-2.3 5.7"/>'
    };
    function sello(nombre) {
      const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      s.setAttribute("viewBox", "0 0 24 24");
      s.setAttribute("fill", "none");
      s.setAttribute("stroke", "currentColor");
      s.setAttribute("stroke-width", "2");
      s.setAttribute("stroke-linecap", "round");
      s.setAttribute("stroke-linejoin", "round");
      s.setAttribute("aria-hidden", "true");
      s.innerHTML = ICONOS[nombre]; // íconos fijos, nunca datos
      $("sello").replaceChildren(s);
    }

    function monto(n, moneda) {
      const valor = Number(n);
      if (!isFinite(valor)) return "—";
      const cod = String(moneda || "ARS").toUpperCase();
      try {
        return new Intl.NumberFormat("es-AR", { style: "currency", currency: cod }).format(valor);
      } catch (e) {
        return valor.toLocaleString("es-AR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " " + cod;
      }
    }
    function fecha(v) {
      if (!v) return "—";
      const s = String(v);
      const solo = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
      const d = solo ? new Date(Number(solo[1]), Number(solo[2]) - 1, Number(solo[3])) : new Date(s);
      if (isNaN(d)) return s;
      return d.toLocaleDateString("es-AR", { day: "numeric", month: "long", year: "numeric" });
    }
    const texto = v => (v == null || v === "") ? "—" : String(v);

    function estado(clase, icono, titulo, bajada) {
      $("caja").className = "tarjeta " + clase;
      sello(icono);
      $("titulo").textContent = titulo;
      $("bajada").textContent = bajada;
    }
    function noVerificado() {
      estado("error", "alerta", "No pudimos verificar este recibo", "Revisá que el enlace esté completo o consultá a quien te lo envió.");
      $("detalle").hidden = true;
      document.title = "Recibo no verificado | Barbería Augusto";
    }

    function mostrar(d, anulado) {
      $("vMonto").textContent = monto(d.monto, d.moneda);
      $("vCodigo").textContent = texto(d.codigo);
      $("vFecha").textContent = fecha(d.fecha);
      $("vPeriodo").textContent = texto(d.periodo);
      $("vConcepto").textContent = texto(d.concepto);
      $("vEmisor").textContent = d.emisor ? String(d.emisor) : EMISOR;
      $("avisoAnulado").hidden = !anulado;
      $("pieImpresion").textContent = "Verificado el " + new Date().toLocaleDateString("es-AR", { day: "numeric", month: "long", year: "numeric" }) + " en " + location.origin + location.pathname;
      $("detalle").hidden = false;
      if (anulado) {
        estado("anulado", "alerta", "Este recibo fue anulado", "El código existe, pero el recibo ya no tiene validez.");
        document.title = "Recibo anulado | Barbería Augusto";
      } else {
        estado("ok", "ok", "Recibo auténtico", "Este recibo fue emitido por " + (d.emisor ? String(d.emisor) : EMISOR) + " y está vigente.");
        document.title = "Recibo " + texto(d.codigo) + " | Barbería Augusto";
      }
    }

    async function verificar() {
      sello("cargando");
      const q = new URLSearchParams(location.search);
      const codigo = (q.get("c") || "").trim();
      const clave = (q.get("k") || "").trim();
      if (!codigo || !clave || codigo.length > 100 || clave.length > 200) { noVerificado(); return; }

      const r = await sb.rpc("recibo_verificar", { p_codigo: codigo, p_token: clave });
      let d = r && !r.error ? r.data : null;
      if (Array.isArray(d)) d = d[0];
      if (!d || typeof d !== "object") { noVerificado(); return; }
      if (d.anulado === true) mostrar(d, true);
      else if (d.valido === true) mostrar(d, false);
      else noVerificado();
    }

    $("imprimir").onclick = function () { window.print(); };
    verificar();
  </script>
</body>
</html>
